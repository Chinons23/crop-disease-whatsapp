[project]
name = "crop-disease-whatsapp"
version = "0.1.0"
description = "Smallholder farmers across Africa lose significant yields to crop diseases they cannot identify early."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core ML
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=0.9",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.2",
    # Experiment / config
    "pyyaml>=6.0",
    "tqdm>=4.66",
    # Web / bot
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "twilio>=9.0",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    # Notebooks / EDA
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Testing
    "pytest>=8.0",
    "streamlit>=1.66.1",
]
